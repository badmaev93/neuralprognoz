
experiment_name: kolyma_pikla_q3
dataset: generic
data_dir: /content/drive/MyDrive/neuralprognoz_project/data/generic_dataset
device: cuda:0
seed: 42
num_workers: 0

train_basin_file: /content/drive/MyDrive/neuralprognoz_project/data/generic_dataset/basin_lists/train_basins.txt
validation_basin_file: /content/drive/MyDrive/neuralprognoz_project/data/generic_dataset/basin_lists/validation_basins.txt
test_basin_file: /content/drive/MyDrive/neuralprognoz_project/data/generic_dataset/basin_lists/test_basins.txt

train_start_date: ['01/01/1950']
train_end_date:   ['31/12/2010']
validation_start_date: ['01/01/2011']
validation_end_date:   ['31/12/2014']
test_start_date: ['01/01/2015']
test_end_date:   ['30/09/2024']

target_variables: ['streamflow']
dynamic_inputs:
  - precipitation
  - temperature_mean
  - snowmelt
  - pet_priestley_taylor
  - sdwe
  - p_rolling_3m
  - precip_lag_1m
  - t_rolling_3m
  - month_sin
  - month_cos

model: pikla
head: regression
hidden_size: 128
output_dropout: 0.3

kan_hidden_features: 64
kan_grid_size: 5
kan_spline_order: 3
attention_heads: 4

temperature_variable: temperature_mean
precipitation_variable: precipitation

optimizer: AdamW
loss: MaskedSSigmaDeltaLoss
learning_rate: 0.001
batch_size: 64
epochs: 60
clip_gradient_norm: 1.0

seq_length: 24
predict_last_n: 3

metrics:
  - S/sigma_delta
  - NSE
  - RMSE

save_validation_results: True
validate_every: 1
save_weights_every: 5
log_tensorboard: True
