dynamic_inputs:
  - precipitation
  - temperature_mean
  - solar_radiation
  - sdwe
  - pet_priestley_taylor
  - month_sin
  - month_cos
  - aridity_index
  - snow_fraction
  - p_rolling_3m
  - t_rolling_3m
 # - snowmelt
